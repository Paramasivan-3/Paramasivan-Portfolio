<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Gallery — Paramasivan V</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; color: #fff; overflow-x: hidden; }

    /* ── Ambient + Grain ────────────────────────────────────── */
    #ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .grain {
      position: fixed; inset: -200%; z-index: 1;
      pointer-events: none; opacity: .022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain .5s steps(2) infinite;
    }
    @keyframes grain {
      0%  { transform: translate(0,0); }
      25% { transform: translate(-2%,-3%); }
      50% { transform: translate(1%,2%); }
      75% { transform: translate(-1%,1%); }
    }

    /* ── Back Button (z-index above everything) ─────────────── */
    .back-btn {
      position: fixed; top: 40px; left: 40px; z-index: 99999;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      background: rgba(0,0,0,.5);
      border: 1px solid #00D4FF; border-radius: 999px;
      padding: 12px 22px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Space Mono', monospace; font-size: 11px;
      color: #fff; letter-spacing: .06em; white-space: nowrap;
      transition: transform .25s, box-shadow .25s;
    }
    .back-btn:hover { transform: scale(1.06); box-shadow: 0 0 28px rgba(0,212,255,.5); }

    /* ══════════════════════════════════════════════════════════
       S1 — INTRO (own full-screen section)
    ══════════════════════════════════════════════════════════ */
    .s-intro {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; overflow: hidden; z-index: 2;
    }
    .s-intro::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,.3), transparent);
    }
    .s-intro__eye {
      font-family: 'Space Mono', monospace; font-size: 9.5px;
      letter-spacing: .34em; text-transform: uppercase; color: #00D4FF; margin-bottom: 26px;
    }
    .s-intro__title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(58px, 11vw, 145px);
      font-weight: 800; line-height: .86; letter-spacing: -.045em; text-transform: uppercase;
    }
    .s-intro__line { display: block; overflow: hidden; }
    .s-intro__word { display: inline-block; }
    .s-intro__word--stroke {
      color: transparent; -webkit-text-stroke: 2px #00D4FF;
      text-shadow: 0 0 80px rgba(0,212,255,.25);
    }
    .s-intro__meta {
      margin-top: 36px; display: flex; align-items: center; gap: 18px;
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.28);
    }
    .s-intro__meta-line { width: 36px; height: 1px; background: rgba(255,255,255,.14); }
    .s-intro__scroll {
      position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .s-intro__scroll-track {
      width: 1px; height: 52px; background: rgba(255,255,255,.08);
      overflow: hidden; position: relative;
    }
    .s-intro__scroll-bar {
      position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
      background: #00D4FF; animation: sdrop 1.9s ease-in-out infinite;
    }
    @keyframes sdrop { 0%{top:-100%;} 100%{top:100%;} }
    .s-intro__scroll-text {
      font-family: 'Space Mono', monospace; font-size: 7.5px;
      letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.2);
    }

    /* ══════════════════════════════════════════════════════════
       S2 — HORIZONTAL GALLERY
    ══════════════════════════════════════════════════════════ */
    .s-gallery { position: relative; background: #000; z-index: 2; }

    /* Stage: NO overflow:hidden — mask handles edges instead */
    .s-gallery__stage {
      position: relative; width: 100%; height: 100vh; min-height: 520px;
      /* Soft fade at left/right edges so cards never look physically cut off */
      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        #000 8%,
        #000 92%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to right,
        transparent 0%,
        #000 8%,
        #000 92%,
        transparent 100%
      );
    }

    /* Horizontal track — 3-row grid */
    .s-gallery__track {
      position: relative;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      grid-auto-flow: column;
      gap: 14px 18px;
      width: max-content; height: 100%;
      padding: 16px 8vw; will-change: transform;
    }

    /* ── Cards ── */
    .g-card {
      position: relative;
      height: 100%; /* fills grid row — all images fully visible */
      border-radius: 12px; overflow: hidden; cursor: pointer;
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,.05);
      box-shadow: 0 8px 40px rgba(0,0,0,.65);
      transition: box-shadow .3s;
    }
    .g-card::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: var(--cc, #00D4FF);
      opacity: 0; transition: opacity .3s;
    }
    .g-card:hover { box-shadow: 0 18px 64px rgba(0,0,0,.85), 0 0 0 1px rgba(0,212,255,.22); }
    .g-card:hover::after { opacity: 1; }
    .g-card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .g-card__cap {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 32px 16px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,.92));
      display: flex; flex-direction: column; gap: 4px;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .g-card:hover .g-card__cap { opacity: 1; }
    .g-card__cat {
      font-family: 'Space Mono', monospace; font-size: 7.5px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--cc, #00D4FF);
    }
    .g-card__title {
      font-family: 'Syne', sans-serif; font-size: 12.5px; font-weight: 700;
      color: rgba(255,255,255,.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Gallery HUD (fixed, outside pinned stage, always above mask) ── */
    .g-hud {
      position: fixed; inset: 0; z-index: 800; pointer-events: none;
      opacity: 0; transition: opacity .5s;
    }
    .g-hud.is-active { opacity: 1; }
    .g-hud__count {
      position: absolute; bottom: 38px; right: 44px;
      display: flex; align-items: baseline; gap: 5px;
    }
    .g-hud__cur {
      font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800;
      color: #00D4FF; letter-spacing: -.03em; line-height: 1;
    }
    .g-hud__sep { font-size: 14px; color: rgba(255,255,255,.18); }
    .g-hud__tot { font-family: 'Space Mono', monospace; font-size: 13px; color: rgba(255,255,255,.2); }
    .g-hud__bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: rgba(255,255,255,.05);
    }
    .g-hud__bar-fill {
      height: 100%; background: linear-gradient(90deg, #00D4FF, #0066ff);
      transform: scaleX(0); transform-origin: left;
    }

    /* ── Lightbox ─────────────────────────────────────────── */
    .lb {
      position: fixed; inset: 0; z-index: 50000;
      background: rgba(0,0,0,.97);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .28s;
    }
    .lb.is-open { opacity: 1; pointer-events: auto; }
    .lb__close {
      position: fixed; top: 20px; right: 20px;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.8); font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .2s;
    }
    .lb__close:hover { background: rgba(200,30,30,.5); }
    .lb__img-wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:70px 90px 80px; }
    .lb__img { max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; }
    .lb__nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.8); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); transition: background .2s;
    }
    .lb__nav:hover { background: rgba(0,212,255,.22); }
    .lb__nav--l { left: 14px; } .lb__nav--r { right: 14px; }
    .lb__cap {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 12px; padding: 16px 22px;
      background: linear-gradient(transparent, rgba(0,0,0,.92)); pointer-events: none;
    }
    .lb__cat { font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#00D4FF; }
    .lb__ttl { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; color:rgba(255,255,255,.8); flex:1; }
    .lb__ctr { font-family:'Space Mono',monospace; font-size:11px; color:rgba(255,255,255,.28); }

    @media (max-width:640px) {
      .back-btn { top:20px; left:20px; padding:10px 16px; font-size:10px; }
      .g-hud__count { right:20px; bottom:24px; }
      .g-hud__cur { font-size:22px; }
      .s-gallery__track { grid-template-rows: repeat(2, 1fr); gap: 10px 12px; padding: 12px 4vw; }
    }
  </style>
</head>
<body>

<canvas id="ambient" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<!-- Always visible back button — above mask, above everything -->
<a href="Paramasivan-Portfolio.html" class="back-btn">&#8592;&nbsp;Back to Portfolio</a>

<!-- ════ S1 INTRO ════════════════════════════════════════════ -->
<section class="s-intro" id="s-intro">
  <p class="s-intro__eye">Paramasivan V &mdash; Visual Designer</p>
  <h1 class="s-intro__title">
    <span class="s-intro__line"><span class="s-intro__word" id="iw1">Portfolio</span></span>
    <span class="s-intro__line"><span class="s-intro__word s-intro__word--stroke" id="iw2">Gallery</span></span>
  </h1>
  <div class="s-intro__meta">
    <span class="s-intro__meta-line"></span>
    <span id="i-count">197</span>&nbsp;Creatives
    <span class="s-intro__meta-line"></span>
  </div>
  <div class="s-intro__scroll">
    <div class="s-intro__scroll-track"><div class="s-intro__scroll-bar"></div></div>
    <span class="s-intro__scroll-text">Scroll</span>
  </div>
</section>

<!-- ════ S2 GALLERY ══════════════════════════════════════════ -->
<section class="s-gallery" id="s-gallery">
  <div class="s-gallery__stage" id="g-stage">
    <div class="s-gallery__track" id="g-track"></div>
  </div>
</section>

<!-- HUD (fixed, outside pinned element — unaffected by mask) -->
<div class="g-hud" id="g-hud">
  <div class="g-hud__count">
    <span class="g-hud__cur" id="g-cur">00</span>
    <span class="g-hud__sep">/</span>
    <span class="g-hud__tot" id="g-tot">00</span>
  </div>
  <div class="g-hud__bar"><div class="g-hud__bar-fill" id="g-fill"></div></div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="lb__close" id="lb-close">&#10005;</button>
  <button class="lb__nav lb__nav--l" id="lb-prev">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L7 10l5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="lb__img-wrap"><img class="lb__img" id="lb-img" src="" alt="" /></div>
  <button class="lb__nav lb__nav--r" id="lb-next">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4l5 6-5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="lb__cap">
    <span class="lb__cat" id="lb-cat"></span>
    <span class="lb__ttl" id="lb-ttl"></span>
    <span class="lb__ctr" id="lb-ctr"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/ScrollTrigger.min.js"></script>
<script src="assets/portfolio/portfolio-data.js"></script>
<script>
/* ── 3D Perspective Grid Background ──────────────────────── */
(function(){
  var c=document.getElementById('ambient'),ctx=c.getContext('2d'),W,H;
  var t=0;
  var COLS=14, ROWS=18;
  var HY=0.42; /* horizon y fraction — 42% down the screen */

  /* Stars in the sky (above horizon) */
  var NSTARS=110;
  var stars=[];
  for(var i=0;i<NSTARS;i++){
    stars.push({
      x:Math.random(),
      y:Math.random()*HY,
      sz:0.3+Math.random()*1.4,
      ph:Math.random()*Math.PI*2,
      sp:2+Math.random()*4 /* twinkle speed multiplier */
    });
  }

  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  window.addEventListener('resize',resize);resize();

  (function frame(){
    ctx.clearRect(0,0,W,H);
    t+=0.0025;

    var horizon=H*HY;
    var bottom=H*1.10; /* slightly beyond bottom for clean edge bleed */
    var cx=W/2;

    /* Sky gradient — subtle deep blue tint above horizon */
    var sky=ctx.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,'rgba(0,4,18,0.55)');
    sky.addColorStop(1,'rgba(0,12,28,0)');
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,horizon);

    /* Horizon glow line */
    var hg=ctx.createLinearGradient(0,horizon-28,0,horizon+55);
    hg.addColorStop(0,'rgba(0,212,255,0)');
    hg.addColorStop(0.38,'rgba(0,212,255,0.055)');
    hg.addColorStop(0.6,'rgba(0,212,255,0.03)');
    hg.addColorStop(1,'rgba(0,212,255,0)');
    ctx.fillStyle=hg;
    ctx.fillRect(0,horizon-28,W,83);

    /* Thin horizon line */
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    ctx.lineTo(W,horizon);
    ctx.strokeStyle='rgba(0,212,255,0.10)';
    ctx.lineWidth=0.7;
    ctx.stroke();

    /* ── Vertical grid lines — fan from vanishing point ─── */
    for(var col=-COLS;col<=COLS;col++){
      var xNear=cx+(col/COLS)*W*0.60;
      var alpha;
      if(col===0){ alpha=0.22; }
      else { alpha=Math.max(0,0.09-(Math.abs(col/COLS))*0.082); }
      if(alpha<0.005)continue;
      ctx.beginPath();
      ctx.moveTo(cx,horizon);
      ctx.lineTo(xNear,bottom);
      ctx.strokeStyle='rgba(0,212,255,'+alpha.toFixed(3)+')';
      ctx.lineWidth=(col===0)?1.0:0.5;
      ctx.stroke();
    }

    /* ── Horizontal grid lines — perspective-animated ───── */
    var zoff=t%1;
    for(var row=0;row<ROWS;row++){
      var frac=((row/ROWS+zoff)%1.0);
      /* Quadratic maps linear [0-1] to perspective-compressed spacing */
      var p=frac*frac;
      var y=horizon+(bottom-horizon)*p;
      /* Width grows with depth illusion */
      var hw=(W*0.52)*p;
      /* Alpha brightest at mid-distance, fades at horizon and near-edge */
      var edgeFade=Math.min(1,frac*6); /* fade in from horizon */
      var a=p*edgeFade*0.16;
      ctx.beginPath();
      ctx.moveTo(cx-hw,y);
      ctx.lineTo(cx+hw,y);
      ctx.strokeStyle='rgba(0,212,255,'+a.toFixed(3)+')';
      ctx.lineWidth=0.5;
      ctx.stroke();
    }

    /* ── Stars — twinkle above horizon ───────────────────── */
    for(var j=0;j<stars.length;j++){
      var s=stars[j];
      var sa=Math.max(0,0.05+0.30*Math.abs(Math.sin(t*s.sp+s.ph)));
      ctx.beginPath();
      ctx.arc(s.x*W,s.y*H,s.sz,0,Math.PI*2);
      ctx.fillStyle='rgba(200,235,255,'+sa.toFixed(3)+')';
      ctx.fill();
    }

    /* ── Subtle ground fog near bottom ───────────────────── */
    var fog=ctx.createLinearGradient(0,H*0.85,0,H);
    fog.addColorStop(0,'rgba(0,0,0,0)');
    fog.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle=fog;
    ctx.fillRect(0,H*0.85,W,H*0.15);

    requestAnimationFrame(frame);
  })();
})();

/* ── Data ─────────────────────────────────────────────────── */
gsap.registerPlugin(ScrollTrigger);

var CAT_COLOR={
  'Festival Creatives':'#06B6D4',
  'Travel Promotions':'#8B5CF6',
  'Lead Generation Creatives':'#10B981',
  'Social Media Designs':'#F59E0B'
};
var RAW=window.PORTFOLIO_DATA||[];
var allImages=[];
RAW.forEach(function(p){
  var imgs=Array.isArray(p.images)&&p.images.length?p.images:(p.image?[p.image]:[]);
  imgs.forEach(function(src){
    allImages.push({src:src,title:p.title||'Untitled',category:p.category||'Social Media Designs'});
  });
});
document.getElementById('g-tot').textContent   = String(allImages.length).padStart(2,'0');
document.getElementById('i-count').textContent  = allImages.length||197;

/* ── Build cards ─────────────────────────────────────────── */
var gTrack = document.getElementById('g-track');
var ROWS = 3;
/* Each row fills 1/3 of viewport; card widths are aspect-ratio-proportional to rowH */
var rowH = Math.floor((window.innerHeight - 80) / ROWS); /* 80 = padding (32) + gaps (28) + buffer */
/* Width ratios cycling per column (col = floor(i/ROWS)) */
var WRATIOS = [0.72, 1.55, 1.02, 0.85]; /* portrait / landscape / square / medium */

var cards=[];
allImages.forEach(function(img,i){
  var col = Math.floor(i / ROWS);
  var w   = Math.round(rowH * WRATIOS[col % WRATIOS.length]);
  var cc  = CAT_COLOR[img.category]||'#00D4FF';
  var el  = document.createElement('div');
  el.className='g-card';
  el.dataset.idx=i;
  el.style.width=w+'px';
  el.style.setProperty('--cc',cc);
  el.innerHTML=
    "<img src='"+img.src.replace(/'/g,"&apos;")+"'"
    +" alt='"+img.title.replace(/'/g,"&apos;")+"'"
    +" loading='lazy' decoding='async'>"
    +"<div class='g-card__cap'>"
    +"<span class='g-card__cat'>"+img.category+"</span>"
    +"<span class='g-card__title'>"+img.title+"</span>"
    +"</div>";
  gTrack.appendChild(el);
  cards.push({el:el,cardW:w});
});

/* ── Lightbox ─────────────────────────────────────────────── */
var lbIdx=0;
function openLb(idx){
  lbIdx=Math.max(0,Math.min(idx,allImages.length-1));
  var it=allImages[lbIdx];
  document.getElementById('lb-img').src=it.src;
  document.getElementById('lb-cat').textContent=it.category;
  document.getElementById('lb-ttl').textContent=it.title;
  document.getElementById('lb-ctr').textContent=(lbIdx+1)+' / '+allImages.length;
  document.getElementById('lb').classList.add('is-open');
  document.body.style.overflow='hidden';
}
function closeLb(){
  document.getElementById('lb').classList.remove('is-open');
  document.body.style.overflow='';
}
document.getElementById('lb-close').addEventListener('click',closeLb);
document.getElementById('lb-prev').addEventListener('click',function(){openLb(lbIdx-1);});
document.getElementById('lb-next').addEventListener('click',function(){openLb(lbIdx+1);});
document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)closeLb();});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb').classList.contains('is-open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')openLb(lbIdx-1);
  if(e.key==='ArrowRight')openLb(lbIdx+1);
});
gTrack.addEventListener('click',function(e){
  var card=e.target.closest('.g-card');
  if(card)openLb(parseInt(card.dataset.idx));
});

/* ── GSAP ────────────────────────────────────────────────── */
window.addEventListener('load',function(){

  /* S1 intro entrance */
  gsap.fromTo('#iw1',{yPercent:110},{yPercent:0,duration:1.1,ease:'power4.out',delay:.15});
  gsap.fromTo('#iw2',{yPercent:110},{yPercent:0,duration:1.1,ease:'power4.out',delay:.30});
  gsap.fromTo('.s-intro__eye', {opacity:0,y:14},{opacity:1,y:0,duration:.9,ease:'power3.out',delay:.1});
  gsap.fromTo('.s-intro__meta',{opacity:0,y:10},{opacity:1,y:0,duration:.8,ease:'power3.out',delay:.8});

  /* S2 gallery: measure */
  void gTrack.offsetWidth;
  cards.forEach(function(c){ c.offsetX=c.el.offsetLeft; c.cardW=c.el.offsetWidth; });

  var trackW  = Math.max(200, gTrack.scrollWidth - window.innerWidth);
  var pinDist = Math.max(window.innerHeight * 8, trackW * 0.45);

  var hud     = document.getElementById('g-hud');
  var gFill   = document.getElementById('g-fill');
  var gCur    = document.getElementById('g-cur');

  /* Per-card update: hide off-screen cards; mask softens edges */
  function applyCards(p) {
    var sX  = p * trackW;
    var vpW = window.innerWidth;
    for(var i=0;i<cards.length;i++){
      var c   = cards[i];
      var vx  = c.offsetX - sX;
      var vxR = vx + c.cardW;
      c.el.style.opacity   = (vxR < -150 || vx > vpW + 250) ? '0' : '1';
      c.el.style.transform = '';
    }
  }

  /* Set initial state at p=0 before any scroll */
  applyCards(0);

  /* Main tween */
  gsap.to(gTrack,{
    x: -trackW,
    ease: 'none',
    scrollTrigger:{
      trigger: '#s-gallery',
      start:   'top top',
      end:     '+='+pinDist,
      scrub:   1.2,
      pin:     true,
      invalidateOnRefresh: true,
      onEnter:    function(){ hud.classList.add('is-active'); },
      onLeave:    function(){ hud.classList.remove('is-active'); },
      onEnterBack:function(){ hud.classList.add('is-active'); },
      onLeaveBack:function(){ hud.classList.remove('is-active'); },
      onUpdate: function(self){
        var p = self.progress;
        gFill.style.transform = 'scaleX('+p.toFixed(4)+')';
        gCur.textContent = String(Math.round(p*allImages.length)).padStart(2,'0');
        applyCards(p);
      }
    }
  });

  ScrollTrigger.refresh();
});
</script>
</body>
</html>
